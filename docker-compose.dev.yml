# Local development - builds from source with debug enabled
services:
  bookflow-dev:
    extends:
      file: ./compose/docker-compose.yml
      service: bookflow
    build:
      context: .
      dockerfile: Dockerfile
      target: bookflow
    cap_add:
      - SYS_PTRACE
    environment:
      DEBUG: true
      # HIDE_LOCAL_AUTH: true
      OIDC_AUTO_REDIRECT: true
    volumes:
      - ./.local/config:/config
      - ./.local/books:/books
      - ./.local/log:/var/log/bookflow
      - ./.local/tmp:/tmp/bookflow
      - ./bookflow:/app/bookflow:ro
      - ./frontend-dist:/app/frontend-dist:ro
      # Required for torrent / usenet - path must match your download client's volume exactly
      # - /path/to/downloads:/path/to/downloads
